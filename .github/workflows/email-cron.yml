# Email queue worker trigger — every 10 minutes (Vercel Hobby cron runs only once a day).
# Sends queued emails (retries with backoff, respects the daily limit), sends quota alerts and reads bounces.
# Secrets: APP_URL (e.g. https://staffing.synerax.in) and CRON_SECRET (same value as in Vercel).
# Note: GitHub may delay scheduled runs by a few minutes at busy times; emails are still sent immediately
# when the quota allows — this only picks up retries and anything that had to wait.
name: Email queue (every 10 min)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: email-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process the queue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::warning::APP_URL / CRON_SECRET not set"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/email"
